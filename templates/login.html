<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entrar | FinFlow - Gestão Financeira Pessoal</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinFlow">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/wallet.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Google Identity Services (GSI) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-200 relative overflow-x-hidden">

  <!-- Glow de fundo sutil -->
  <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-indigo-500/10 dark:bg-indigo-600/15 blur-[120px] pointer-events-none rounded-full"></div>

  <!-- Header Superior -->
  <header class="max-w-7xl w-full mx-auto px-6 py-5 flex items-center justify-between relative z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i data-lucide="wallet-cards" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          FinFlow <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 font-semibold border border-indigo-200 dark:border-indigo-700/40">PRO</span>
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Controle Financeiro Pessoal</p>
      </div>
    </div>

    <!-- Alternar Tema (Modo Claro / Modo Escuro) -->
    <button id="btn-theme-login" title="Alternar tema claro/escuro" class="p-2.5 rounded-xl text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white bg-white/80 dark:bg-slate-900/80 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 shadow-sm transition">
      <i id="theme-login-icon" data-lucide="sun" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- Card Central de Login / Cadastro -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <div class="w-full max-w-md bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl dark:shadow-2xl dark:shadow-indigo-950/40 backdrop-blur-xl relative overflow-hidden transition-colors duration-200">
      
      <!-- Detalhe decorativo no topo -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

      <!-- Abas de Alternância: Entrar vs Cadastrar -->
      <div class="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-slate-950/80 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800/80 mb-6">
        <button id="tab-btn-login" class="py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Entrar</span>
        </button>
        <button id="tab-btn-register" class="py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Criar Conta</span>
        </button>
      </div>

      <!-- BOTÃO GOOGLE SIGN-IN EM DESTAQUE -->
      <div class="space-y-4">
        
        <!-- Botão customizado ou gatilho Google -->
        <button id="btn-google-login" type="button" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-2xl bg-white hover:bg-slate-50 dark:bg-slate-800 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200 text-sm font-semibold transition shadow-sm hover:shadow border border-slate-200 dark:border-slate-700 transform hover:-translate-y-0.5 active:translate-y-0">
          <!-- Ícone oficial do Google SVG -->
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span class="whitespace-nowrap">Continuar com Google / Gmail</span>
        </button>

        <!-- Divisor corrigido sem quebra de linha -->
        <div class="relative flex items-center justify-center my-5">
          <div class="border-t border-slate-200 dark:border-slate-800 flex-1"></div>
          <span class="px-3 text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0 whitespace-nowrap select-none">
            ou com seu e-mail
          </span>
          <div class="border-t border-slate-200 dark:border-slate-800 flex-1"></div>
        </div>
      </div>

      <!-- FORMULÁRIO 1: LOGIN -->
      <form id="form-login" class="mt-2 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">E-mail</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="email" id="login-email" required placeholder="seuemail@exemplo.com" class="w-full pl-10 pr-3 py-2.5 text-sm bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none focus:bg-white dark:focus:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Senha</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="password" id="login-senha" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none focus:bg-white dark:focus:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition">
            <button type="button" class="btn-toggle-password absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 shadow-lg shadow-indigo-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <span>Entrar no FinFlow</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- FORMULÁRIO 2: CADASTRO -->
      <form id="form-register" class="mt-2 space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nome Completo</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="text" id="reg-nome" required placeholder="Como deseja ser chamado(a)" class="w-full pl-10 pr-3 py-2.5 text-sm bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none focus:bg-white dark:focus:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">E-mail</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="email" id="reg-email" required placeholder="seuemail@exemplo.com" class="w-full pl-10 pr-3 py-2.5 text-sm bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none focus:bg-white dark:focus:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Senha (mínimo 6 caracteres)</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="password" id="reg-senha" required minlength="6" placeholder="Crie uma senha forte" class="w-full pl-10 pr-10 py-2.5 text-sm bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none focus:bg-white dark:focus:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition">
            <button type="button" class="btn-toggle-password absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 shadow-lg shadow-indigo-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <span>Criar Minha Conta Grátis</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-6 text-center text-[11px] text-slate-500 dark:text-slate-400">
        Seus dados financeiros são salvos localmente e protegidos de ponta a ponta.
      </div>

    </div>
  </main>

  <!-- Rodapé -->
  <footer class="py-4 text-center text-xs text-slate-500 dark:text-slate-400 relative z-10">
    FinFlow &bull; Sistema de Gestão Financeira Pessoal Inteligente
  </footer>

  <!-- Script de Login / Cadastro -->
  <script>
    // Configuração do Google Client ID (injetada pelo Flask ou via API)
    const GOOGLE_CLIENT_ID = "{{ google_client_id | default('') }}";

    document.addEventListener('DOMContentLoaded', () => {
      initLoginTheme();
      setupAuthTabs();
      setupPasswordToggles();
      setupForms();
      setupGoogleAuth();
      lucide.createIcons();
    });

    // Controle de Tema no Login
    function initLoginTheme() {
      const savedTheme = localStorage.getItem('finflow_theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateLoginThemeIcon();

      document.getElementById('btn-theme-login')?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('finflow_theme', isDark ? 'dark' : 'light');
        updateLoginThemeIcon();
      });
    }

    function updateLoginThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      const btn = document.getElementById('btn-theme-login');
      if (btn) {
        btn.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="w-5 h-5"></i>`;
        btn.setAttribute('title', isDark ? 'Mudar para tema claro' : 'Mudar para tema escuro');
        lucide.createIcons();
      }
    }

    // Alternância de Abas: Entrar vs Criar Conta
    function setupAuthTabs() {
      const btnLogin = document.getElementById('tab-btn-login');
      const btnRegister = document.getElementById('tab-btn-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (!btnLogin || !btnRegister) return;

      btnLogin.addEventListener('click', () => {
        btnLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
        btnRegister.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200';
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      });

      btnRegister.addEventListener('click', () => {
        btnRegister.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
        btnLogin.className = 'py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200';
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      });
    }

    // Alternar visibilidade de senha
    function setupPasswordToggles() {
      document.querySelectorAll('.btn-toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = btn.previousElementSibling;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
          } else {
            input.type = 'password';
            btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
          }
          lucide.createIcons();
        });
      });
    }

    // Submissão de formulários
    function setupForms() {
      // Submeter Login
      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            Swal.fire({
              icon: 'success',
              title: data.message || 'Login realizado!',
              timer: 1000,
              showConfirmButton: false
            }).then(() => {
              window.location.href = '/';
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Não foi possível entrar',
              text: data.error || 'Verifique seus dados e tente novamente.'
            });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Não foi possível conectar ao servidor.' });
        }
      });

      // Submeter Cadastro
      document.getElementById('form-register')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('reg-nome').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const senha = document.getElementById('reg-senha').value;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, email, senha })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            Swal.fire({
              icon: 'success',
              title: 'Conta Criada!',
              text: 'Sua base de dados foi iniciada com sucesso. Redirecionando...',
              timer: 1200,
              showConfirmButton: false
            }).then(() => {
              window.location.href = '/';
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Erro no Cadastro',
              text: data.error || 'Ocorreu um erro ao criar sua conta.'
            });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Não foi possível conectar ao servidor.' });
        }
      });
    }

    // Google Sign-In (Nativo GSI com Client ID + Fallback Amigável para Localhost)
    function setupGoogleAuth() {
      const isDark = () => document.documentElement.classList.contains('dark');

      // Se GOOGLE_CLIENT_ID estiver presente, inicializa o Google Identity Services oficial
      if (GOOGLE_CLIENT_ID && typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredentialResponse
        });
      }

      document.getElementById('btn-google-login')?.addEventListener('click', async () => {
        // Se há Client ID do Google configurado, aciona o prompt nativo oficial da Google
        if (GOOGLE_CLIENT_ID && typeof google !== 'undefined' && google.accounts) {
          google.accounts.id.prompt();
          return;
        }

        // Em modo de desenvolvimento local (sem GOOGLE_CLIENT_ID), exibir modal moderno de teste
        const darkTheme = isDark();
        const bgModal = darkTheme ? '#0f172a' : '#ffffff';
        const textColor = darkTheme ? '#f8fafc' : '#0f172a';
        const inputBg = darkTheme ? '#1e293b' : '#f8fafc';
        const inputBorder = darkTheme ? '#334155' : '#cbd5e1';

        const { value: formValues } = await Swal.fire({
          title: '<span style="font-size:1.15rem; font-weight:700;">Entrar com Google / Gmail</span>',
          background: bgModal,
          color: textColor,
          html: `
            <div class="text-left space-y-3.5 p-1" style="font-size: 0.85rem;">
              <div class="p-3 rounded-xl ${darkTheme ? 'bg-indigo-950/40 border border-indigo-800/50 text-indigo-300' : 'bg-indigo-50 border border-indigo-200 text-indigo-800'} text-xs">
                <p class="font-bold flex items-center gap-1.5 mb-1">
                  <span>💡 Modo Desenvolvimento Local:</span>
                </p>
                <p>Em produção com a chave <code>GOOGLE_CLIENT_ID</code> configurada, a janela oficial do Google abrirá diretamente para login com 1 clique.</p>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1" style="color: ${darkTheme ? '#94a3b8' : '#475569'};">Seu Nome</label>
                <input id="swal-google-nome" style="background:${inputBg}; color:${textColor}; border:1px solid ${inputBorder}; border-radius:0.75rem; width:100%; padding:0.6rem 0.75rem; font-size:0.875rem; outline:none;" placeholder="Ex: Anderson Nogueira" value="Anderson Nogueira">
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1" style="color: ${darkTheme ? '#94a3b8' : '#475569'};">Seu Gmail</label>
                <input id="swal-google-email" style="background:${inputBg}; color:${textColor}; border:1px solid ${inputBorder}; border-radius:0.75rem; width:100%; padding:0.6rem 0.75rem; font-size:0.875rem; outline:none;" placeholder="seuemail@gmail.com" value="anderson@gmail.com">
              </div>
            </div>
          `,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: 'Continuar com Google',
          cancelButtonText: 'Cancelar',
          confirmButtonColor: '#4f46e5',
          cancelButtonColor: darkTheme ? '#475569' : '#94a3b8',
          customClass: {
            popup: 'rounded-3xl shadow-2xl',
            confirmButton: 'rounded-xl font-bold text-sm px-5 py-2.5 shadow-lg shadow-indigo-600/30',
            cancelButton: 'rounded-xl font-semibold text-sm px-4 py-2.5'
          },
          preConfirm: () => {
            const nome = document.getElementById('swal-google-nome').value.trim();
            const email = document.getElementById('swal-google-email').value.trim();
            if (!email || !email.includes('@')) {
              Swal.showValidationMessage('Por favor, informe um e-mail válido');
              return false;
            }
            return { nome, email };
          }
        });

        if (formValues) {
          try {
            const res = await fetch('/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                nome: formValues.nome,
                email: formValues.email,
                avatar_url: `https://ui-avatars.com/api/?name=${encodeURIComponent(formValues.nome)}&background=6366f1&color=fff`
              })
            });
            const data = await res.json();

            if (res.ok && data.success) {
              Swal.fire({
                icon: 'success',
                title: 'Conectado com Google!',
                timer: 1000,
                showConfirmButton: false
              }).then(() => {
                window.location.href = '/';
              });
            } else {
              Swal.fire({ icon: 'error', title: 'Erro ao entrar com Google', text: data.error });
            }
          } catch (err) {
            Swal.fire({ icon: 'error', title: 'Erro', text: 'Falha na comunicação com o servidor.' });
          }
        }
      });
    }

    // Callback para resposta do Google Identity Services oficial (JWT Token)
    async function handleGoogleCredentialResponse(response) {
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          Swal.fire({
            icon: 'success',
            title: 'Conectado com Google!',
            timer: 1000,
            showConfirmButton: false
          }).then(() => {
            window.location.href = '/';
          });
        } else {
          Swal.fire({ icon: 'error', title: 'Erro na autenticação', text: data.error });
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Erro', text: 'Falha ao processar login com Google.' });
      }
    }
  </script>
</body>
</html>
